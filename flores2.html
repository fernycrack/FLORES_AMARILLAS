<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arma tu ramo de flores amarillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#FFF5F3; --ink:#5B3F63; --muted:#77597E; --surface:#FFFFFF; --line:#EBD8E4;
  --accent:#FFD95E; --on-accent:#4A3350; --focus:#7A4BD1; --pill:#F7E9F3;
  --stage1:#FFF1C2; --stage2:#FFE0E9; --stage3:#E7DFFA; --note:#FFF3B8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:auto}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2B2031; --ink:#FCEFF4; --muted:#D9C3DF; --surface:#3C2D45; --line:#5A4666;
    --focus:#FFE58F; --pill:#3C2D45;
  }
}
:root[data-theme="dark"]{
  --bg:#2B2031; --ink:#FCEFF4; --muted:#D9C3DF; --surface:#3C2D45; --line:#5A4666;
  --focus:#FFE58F; --pill:#3C2D45;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.5;min-height:100vh}
h1,h2{font-family:Caprasimo,Georgia,"Times New Roman",serif;font-weight:400;margin:0}
button,input,textarea{font:inherit;color:inherit}

.top{max-width:1120px;margin:0 auto;padding:26px 20px 6px}
.top .date{margin:0 0 6px;color:var(--muted);font-weight:700}
.top h1{font-size:clamp(2.1rem,5.4vw,3.6rem);line-height:1.04;max-width:16ch}
.top .lead{margin:12px 0 0;max-width:52ch;color:var(--muted)}

.wrap{max-width:1120px;margin:0 auto;padding:18px 20px 56px;display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  grid-template-areas:"stage panel" "tools panel";column-gap:40px;row-gap:16px;align-items:start}
.stage-area{grid-area:stage}
.panel{grid-area:panel}
.tools{grid-area:tools}

.stage{position:relative;overflow:hidden;width:100%;aspect-ratio:540/620;
  border-radius:270px 270px 32px 32px;
  background:linear-gradient(180deg,var(--stage1) 0%,var(--stage2) 58%,var(--stage3) 100%);
  border:3px solid var(--ink)}
.stage #art,.stage #art svg{width:100%;height:100%;display:block}

.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rain i{position:absolute;top:-24px;display:block;border-radius:60% 0 60% 0;opacity:0;animation:fall 3.2s ease-in both}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(640px) rotate(420deg);opacity:0}}

.bqa{transform-box:fill-box;transform-origin:50% 100%}
.pop .bqa{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.94)}100%{transform:scale(1)}}
.deliver .glide{animation:glide 1.1s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes glide{0%{transform:translateX(190px);opacity:0}25%{opacity:1}100%{transform:none;opacity:1}}
.deliver .hop{animation:hop 1.1s ease-out .9s 2}
@keyframes hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-20px)}65%{transform:translateY(0)}82%{transform:translateY(-8px)}}

.tools .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:.62rem 1.15rem;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
:where(button,input,textarea):focus-visible{outline:3px solid var(--focus);outline-offset:3px}

.note{margin-top:20px;background:var(--note);color:#4A3350;padding:18px 22px 20px;border-radius:8px 26px 8px 26px;transform:rotate(-1.2deg);box-shadow:0 5px 0 rgba(91,63,99,.18);max-width:440px}
.note[hidden]{display:none}
.note h2{font-size:1.25rem;line-height:1.2}
.note .to{margin:10px 0 0;font-weight:800}
.note .msg{margin:2px 0 0;font-size:1.05rem;overflow-wrap:anywhere}

.steps{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -2px;scrollbar-width:thin}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:2px solid var(--line);background:var(--pill);border-radius:999px;padding:.4rem .9rem .4rem .45rem;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--ink)}
.pill b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-size:.78rem}
.pill[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill[aria-current="step"] b{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.ptitle{font-size:clamp(1.5rem,3vw,2rem);line-height:1.1}
.phint{margin:6px 0 16px;color:var(--muted);max-width:46ch}
.grp{border:0;margin:0 0 20px;padding:0;min-width:0}
.grp legend{font-weight:800;padding:0;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 9px;border:2px solid var(--line);background:var(--surface);border-radius:22px;cursor:pointer;font-weight:700;font-size:.86rem;line-height:1.15;text-align:center;color:var(--ink);transition:transform .12s}
.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--ink)}
.ico svg{width:66px;height:66px;display:block}

.field{display:block;margin:0 0 14px}
.field span{display:block;font-weight:800;margin-bottom:6px}
.field input,.field textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:.65rem .9rem;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:.35rem .8rem;font-size:.88rem;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

@media (max-width:899px){
  .wrap{display:flex;flex-direction:column;gap:14px;padding-top:8px}
  .stage-area{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 8px;margin:0 -20px;padding-left:20px;padding-right:20px}
  .stage{aspect-ratio:auto;height:min(42vh,112vw);width:100%;border-radius:200px 200px 24px 24px}
  .note{margin-top:14px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header class="top">
  <p class="date">Cada 21 de septiembre se regalan flores amarillas.</p>
  <h1>Arma el ramo que quieres recibir</h1>
  <p class="lead">Elige el papel, las flores, el listón y quién lo entrega. Tu ramo se dibuja mientras eliges.</p>
</header>

<main class="wrap">
  <section class="stage-area" aria-label="Vista de tu ramo">
    <div class="stage" id="stage"><div id="art"></div><div class="rain" id="rain" aria-hidden="true"></div></div>
  </section>

  <section class="panel" id="panel"></section>

  <section class="tools" aria-label="Acciones">
    <div class="row">
      <button class="btn primary" id="deliver" type="button">Entregar mi ramo</button>
      <button class="btn" id="surprise" type="button">Sorpréndeme</button>
      <button class="btn" id="reroll" type="button">Otro acomodo</button>
    </div>
    <article class="note" id="note" hidden aria-live="polite">
      <h2 id="noteTitle"></h2>
      <p class="to" id="noteTo"></p>
      <p class="msg" id="noteMsg"></p>
    </article>
    
    <!-- INICIO DE CÓDIGO AÑADIDO: Interfaz de Exportar y Compartir -->
    <article class="note" id="share-actions" hidden aria-live="polite" style="margin-top: 15px; background: var(--surface); color: var(--ink); transform: none; border: 2px solid var(--line); border-radius: 16px;">
      <h2 style="font-size: 1.15rem; margin-bottom: 12px;">Guarda o envía tu ramo:</h2>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom: 16px;">
        <button class="btn primary" onclick="downloadRamo('png')" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">Descargar PNG</button>
        <button class="btn primary" onclick="downloadRamo('jpeg')" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">Descargar JPG</button>
        <button class="btn primary" onclick="downloadRamo('webp')" style="padding: 0.4rem 0.9rem; font-size: 0.85rem;">Descargar WEBP</button>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn" onclick="shareRamo('wa')" style="padding: 0.4rem 0.9rem; font-size: 0.85rem; background: #25D366; color: white; border-color: #128C7E;">WhatsApp</button>
        <button class="btn" onclick="shareRamo('em')" style="padding: 0.4rem 0.9rem; font-size: 0.85rem; background: #EA4335; color: white; border-color: #C5221F;">Correo</button>
        <button class="btn" id="native-share-btn" onclick="nativeShareRamo()" style="padding: 0.4rem 0.9rem; font-size: 0.85rem; display: none;">Compartir Directo</button>
      </div>
    </article>
    <!-- FIN DE CÓDIGO AÑADIDO -->

  </section>
</main>

<script>
/* ---------- utilidades de color y azar ---------- */
const D2R=Math.PI/180, GOLD=2.39996323;
const hex2rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const rgb2hex=a=>'#'+a.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A.map((v,i)=>v+(B[i]-v)*t))};
const shade=(c,t)=>mix(c,'#5B3F63',t);
const tint=(c,t)=>mix(c,'#ffffff',t);
const lum=c=>{const[r,g,b]=hex2rgb(c);return(.299*r+.587*g+.114*b)/255};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const spin=(n,fn)=>Array.from({length:n},(_,i)=>fn(i,360/n*i)).join('');
const at=(x,y,rot,s,inner)=>`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)}) scale(${s.toFixed(3)})">${inner}</g>`;

/* ---------- catálogo de opciones ---------- */
const PAPERS=[
  {id:'rosa',n:'Rosa',c:'#F8C6D6'},{id:'lila',n:'Lila',c:'#D8C6F2'},{id:'menta',n:'Menta',c:'#BFEBDB'},
  {id:'durazno',n:'Durazno',c:'#FFD2B6'},{id:'celeste',n:'Celeste',c:'#BFDFF8'},{id:'crema',n:'Crema',c:'#FFF0D2'}];
const STYLES=[['liso','Liso'],['lunares','Lunares'],['rayas','Rayas'],['corazones','Corazones']];
const TONES={
  mantequilla:{n:'Mantequilla',l:'#FFF4C2',m:'#FFE27A',d:'#E2B12F'},
  sol:{n:'Sol',l:'#FFE585',m:'#FFCB3D',d:'#D08F14'},
  limon:{n:'Limón',l:'#FBF9B5',m:'#F1EC6E',d:'#B5AD2A'},
  miel:{n:'Miel',l:'#FCE0AE',m:'#F5BE6B',d:'#C4832A'}};
const MAINS=[{id:'girasol',n:'Girasol'},{id:'rosa',n:'Rosa'},{id:'tulipan',n:'Tulipán'},{id:'narciso',n:'Narciso'},{id:'margarita',n:'Margarita'}];
const SECONDS=[{id:'mimosa',n:'Mimosa'},{id:'lavanda',n:'Lavanda'},{id:'nube',n:'Nube blanca'},{id:'nomeolvides',n:'No me olvides'},{id:'eucalipto',n:'Eucalipto'},{id:'rosita',n:'Rosita'}];
const SECDEF={
  mimosa:{lin:0,r0:22,a:18,b:24},lavanda:{lin:1,r0:44,a:46,b:60},nube:{lin:0,r0:20,a:20,b:27},
  nomeolvides:{lin:0,r0:14,a:14,b:19},eucalipto:{lin:1,r0:46,a:46,b:58},rosita:{lin:0,r0:14,a:15,b:19}};
const RIBBONS=[
  {id:'rosa',n:'Rosa',c:'#F291AE'},{id:'amarillo',n:'Amarillo',c:'#FFD24A'},{id:'lila',n:'Lila',c:'#B197EA'},
  {id:'menta',n:'Menta',c:'#7FCFB4'},{id:'azul',n:'Azul',c:'#7DB8EE'},{id:'coral',n:'Coral',c:'#F79A7E'}];
const BOWS=[['mono','Moño'],['nudo','Nudo'],['corazon','Corazón']];
const SIZES={s:{n:'Pequeño',N:5,R:66,S:.94},m:{n:'Mediano',N:8,R:88,S:1},l:{n:'Grande',N:12,R:108,S:1}};
const ANIMALS={
  perro:{n:'Perrito',art:'El perrito',fur:'#EBC59B',dark:'#C79868',belly:'#FFF2E0'},
  gato:{n:'Gatito',art:'El gatito',fur:'#F6CDA8',dark:'#E0A576',belly:'#FFF4E8'},
  conejo:{n:'Conejito',art:'El conejito',fur:'#FDF6F4',dark:'#E6CDD4',belly:'#FFFFFF'},
  oso:{n:'Osito',art:'El osito',fur:'#C9A07F',dark:'#A67D5E',belly:'#F1DCC8'},
  pato:{n:'Patito',art:'El patito',fur:'#FFE27D',dark:'#F2C24A',belly:'#FFF1B5'},
  zorro:{n:'Zorrito',art:'El zorrito',fur:'#F5AE85',dark:'#DE8A5C',belly:'#FFF3E8'}};
const MSGS=['Hoy florecí por ti.','Eres mi persona favorita.','Gracias por existir.','Un ramo amarillo para tu día.'];

/* ---------- flores (radio nominal ~40, centradas en 0,0) ---------- */
const FL={
  girasol:T=>{
    const p='M0,-6 C-8,-14 -7,-32 0,-42 C7,-32 8,-14 0,-6Z';
    let seeds='';for(let k=1;k<=26;k++){const r=Math.sqrt(k/26)*11.5,a=k*137.5*D2R;seeds+=`<circle cx="${(r*Math.cos(a)).toFixed(1)}" cy="${(r*Math.sin(a)).toFixed(1)}" r="1.1" fill="#C79A6E"/>`}
    return spin(18,(i,a)=>`<path d="${p}" transform="rotate(${a})" fill="${T.m}" stroke="${T.d}" stroke-width="1"/>`)
      +spin(18,(i,a)=>`<path d="${p}" transform="rotate(${a+10}) scale(.8)" fill="${T.l}" stroke="${T.d}" stroke-width=".8"/>`)
      +`<circle r="14" fill="#9A6A48"/><circle r="10.5" fill="#7A4E32"/>`+seeds},
  margarita:T=>{
    const p='M0,-8 C-5.5,-16 -5,-32 0,-40 C5,-32 5.5,-16 0,-8Z';
    return spin(14,(i,a)=>`<path d="${p}" transform="rotate(${a})" fill="${T.l}" stroke="${T.d}" stroke-width=".9"/>`)
      +`<circle r="10" fill="${T.d}"/><circle r="7.5" fill="${T.m}"/><circle cx="-2" cy="-2" r="2.4" fill="${tint(T.m,.6)}"/>`},
  rosa:T=>
    spin(5,(i,a)=>`<circle cy="-19" r="15" transform="rotate(${a})" fill="${T.m}" stroke="${T.d}" stroke-width="1"/>`)
    +spin(5,(i,a)=>`<circle cy="-11" r="11.5" transform="rotate(${a+36})" fill="${T.l}" stroke="${T.d}" stroke-width="1"/>`)
    +`<circle r="8" fill="${T.m}" stroke="${T.d}" stroke-width="1"/><path d="M0,0 a2.2,2.2 0 0 1 3.2,-1.4 a4.6,4.6 0 0 1 -6.2,-3 a7,7 0 0 1 9.6,5.8" fill="none" stroke="${T.d}" stroke-width="1.2" stroke-linecap="round"/>`,
  tulipan:T=>
    `<g transform="translate(0 5)"><path d="M-2,14 C-22,10 -27,-14 -20,-36 C-9,-30 -3,-16 -2,14Z" fill="${T.m}" stroke="${T.d}" stroke-width="1" stroke-linejoin="round"/>`
    +`<path d="M2,14 C22,10 27,-14 20,-36 C9,-30 3,-16 2,14Z" fill="${T.m}" stroke="${T.d}" stroke-width="1" stroke-linejoin="round"/>`
    +`<path d="M-12,14 C-22,-6 -14,-30 0,-44 C14,-30 22,-6 12,14 C5,18 -5,18 -12,14Z" fill="${T.l}" stroke="${T.d}" stroke-width="1" stroke-linejoin="round"/>`
    +`<path d="M-4,4 C-8,-10 -5,-24 0,-33" fill="none" stroke="${T.m}" stroke-width="2" stroke-linecap="round"/></g>`,
  narciso:T=>{
    const p='M0,-4 C-15,-12 -13,-33 0,-38 C13,-33 15,-12 0,-4Z';
    return spin(6,(i,a)=>`<path d="${p}" transform="rotate(${a})" fill="${T.l}" stroke="${T.d}" stroke-width="1"/>`)
      +`<circle r="12.5" fill="${T.m}" stroke="${T.d}" stroke-width="1.4"/><circle r="7" fill="${tint(T.m,.45)}" stroke="${T.d}" stroke-width="1"/>`}
};
const SEC={
  mimosa:()=>{const P=[[0,0],[10,-5],[-10,-5],[7,9],[-7,9],[0,-14],[15,4],[-15,4]];
    return P.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="#FFE873" stroke="#F0C43F" stroke-width=".7"/>`).join('')
      +P.map(([x,y])=>`<circle cx="${x-2}" cy="${y-2}" r="1.6" fill="#FFF6C4"/>`).join('')},
  nube:()=>{let s='',pts=[];for(let k=1;k<=14;k++){const r=Math.sqrt(k/14)*17,a=k*2.4;pts.push([r*Math.cos(a),r*Math.sin(a)])}
    pts.forEach(([x,y],i)=>{if(i%2===0)s+=`<path d="M0,0 L${x.toFixed(1)},${y.toFixed(1)}" stroke="#BFDCC9" stroke-width=".8"/>`});
    pts.forEach(([x,y])=>{s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.7" fill="#FFFFFF" stroke="#D9CFEA" stroke-width=".7"/>`});return s},
  nomeolvides:()=>spin(5,(i,a)=>`<circle cy="-6.5" r="5.6" transform="rotate(${a})" fill="#B5DBF8" stroke="#8FBDE6" stroke-width=".7"/>`)+`<circle r="3.2" fill="#FFE27A"/>`,
  rosita:()=>`<circle r="13" fill="#F8BBCB" stroke="#E896AE" stroke-width=".9"/><circle r="8.5" fill="#FBCFDB" stroke="#E896AE" stroke-width=".8"/><path d="M0,0 a1.6,1.6 0 0 1 2.4,-1 a3.4,3.4 0 0 1 -4.6,-2.2 a5.2,5.2 0 0 1 7.2,4.4" fill="none" stroke="#E07C9A" stroke-width="1" stroke-linecap="round"/>`,
  lavanda:()=>{let s=`<path d="M0,0 L0,-44" stroke="#8FBF9F" stroke-width="1.8" stroke-linecap="round"/>`;
    for(let k=0;k<9;k++){const y=-14-k*3.6,c=k%2?'#B7A0EB':'#A48BE0',w=3.2-k*.1;
      s+=`<ellipse cx="${-w-.4}" cy="${y}" rx="${w}" ry="4.2" transform="rotate(-22 ${-w} ${y})" fill="${c}"/><ellipse cx="${w+.4}" cy="${y}" rx="${w}" ry="4.2" transform="rotate(22 ${w} ${y})" fill="${c}"/>`}
    return s+`<ellipse cx="0" cy="-47" rx="2.2" ry="4" fill="#A48BE0"/>`},
  eucalipto:()=>{let s=`<path d="M0,0 C3,-14 -3,-28 1,-46" fill="none" stroke="#8BB89D" stroke-width="1.6" stroke-linecap="round"/>`;
    for(let k=0;k<7;k++){const y=-8-k*6,sd=k%2?1:-1;s+=`<ellipse cx="${sd*5.5}" cy="${y}" rx="5" ry="4.6" fill="#BDE0CB" stroke="#93C3A6" stroke-width=".8"/>`}
    return s+`<ellipse cx="1" cy="-48" rx="4.4" ry="4.8" fill="#BDE0CB" stroke="#93C3A6" stroke-width=".8"/>`}
};
const LEAF=`<path d="M0,0 C9,-10 10,-28 0,-46 C-10,-28 -9,-10 0,0Z" fill="#B4DFC2" stroke="#8CC3A0" stroke-width="1"/><path d="M0,-4 L0,-36" stroke="#8CC3A0" stroke-width="1"/>`;

/* ---------- listón y moños ---------- */
function bowSVG(style,c){
  const dk=shade(c,.24),lt=tint(c,.3),sw=`stroke="${dk}" stroke-width="1.5" stroke-linejoin="round"`;
  if(style==='nudo'){
    const t1='M-3,6 C-12,22 -30,26 -34,42 C-36,50 -26,54 -22,46',t2='M3,6 C14,24 30,28 34,44 C36,52 26,55 22,47';
    return [t1,t2].map(t=>`<path d="${t}" fill="none" stroke="${dk}" stroke-width="10" stroke-linecap="round"/><path d="${t}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round"/>`).join('')
      +`<circle r="9.5" fill="${c}" ${sw}/><circle cx="-2.5" cy="-2.5" r="2.6" fill="${lt}"/>`;
  }
  const tail=`<path d="M-2,4 L-22,48 L-11,43 L-4,54 L6,8Z" fill="${c}" ${sw}/>`;
  if(style==='corazon'){
    const t=`<path d="M-2,8 L-16,46 L-7,42 L-2,52 L5,12Z" fill="${c}" ${sw}/>`;
    return t+`<g transform="scale(-1 1)">${t}</g>`

function armSVG(k){

/* ---------- papel ---------- */
function patDef(id,style,c){
  const light=lum(c)>.88,col=light?shade(c,.16):'#ffffff',op=light?.9:.85,a=`fill="${col}" opacity="${op}"`;
  if(style==='lunares')return `<pattern id="${id}" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" ${a}/><circle cx="17" cy="17" r="3" ${a}/></pattern>`;
  if(style==='rayas')return `<pattern id="${id}" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="6" height="16" ${a}/></pattern>`;
  if(style==='corazones'){const h='M0,4 C-7,-2 -5,-8 0,-4 C5,-8 7,-2 0,4Z';return `<pattern id="${id}" width="26" height="26" patternUnits="userSpaceOnUse"><path transform="translate(7 9)" d="${h}" ${a}/><path transform="translate(20 22)" d="${h}" ${a}/></pattern>`}
  return '';
}
const FLP='M0,0 L-98,-178 Q-50,-198 0,-170Z',FRP='M0,0 L98,-178 Q50,-198 0,-170Z';
const BACKP='M0,0 L-136,-236 Q-68,-258 0,-226 Q68,-258 136,-236Z';

/* ---------- el algoritmo: dibuja el ramo según lo elegido ---------- */
function bouquetInner(){
  const T=TONES[S.tone],base=PAPERS.find(p=>p.id===S.paperColor).c,rib=RIBBONS.find(r=>r.id===S.ribbon).c;
  const {N:n,R:Rm}=SIZES[S.size],DC=[0,-238];
  const rM=rng(S.seed+1),rS=rng(S.seed+2),rL=rng(S.seed+3),rF=rng(S.seed+4),rT=rng(S.seed+5);
  const off=rM()*6.28,off2=rS()*6.28;
  let o='';
  /* 1. tallos que asoman abajo */
  for(let i=0;i<5;i++){const x1=(i-2)*7+(rT()-.5)*4;o+=`<path d="M${(i-2)*3},-8 L${x1.toFixed(1)},${(26+rT()*12).toFixed(1)}" stroke="#7DB994" stroke-width="5.5" stroke-linecap="round"/>`}
  /* 2. forro del papel */
  o+=`<path d="${BACKP}" fill="${tint(base,.35)}" stroke="${shade(base,.25)}" stroke-width="1.6" stroke-linejoin="round"/>`;
  /* 3. hojas en abanico */
  for(let i=0;i<9;i++){const a=-100+200*(i+.5)/9+(rL()-.5)*14,rr=Rm*.75;
    o+=at(DC[0]+rr*Math.sin(a*D2R),DC[1]-rr*Math.cos(a*D2R)*.86,a,1.15+rL()*.5,LEAF)}
  /* 4. flor secundaria de fondo */
  const sd=SECDEF[S.second],secArt=SEC[S.second]();
  if(sd.lin){const m=n+7;for(let i=0;i<m;i++){const a=-100+200*(i+.5)/m+(rS()-.5)*10,rr=Rm*(.7+rS()*.5),px=sd.a+rS()*(sd.b-sd.a);
    o+=at(DC[0]+rr*Math.sin(a*D2R),DC[1]-rr*Math.cos(a*D2R)*.86,a+(rS()-.5)*14,px/sd.r0,secArt)}}
  else{const m=Math.round(n*1.6)+5;for(let i=0;i<m;i++){const rr=Rm*1.15*Math.sqrt((i+.5)/m),th=i*GOLD+off2,px=sd.a+rS()*(sd.b-sd.a);
    o+=at(DC[0]+rr*Math.cos(th),DC[1]+rr*Math.sin(th)*.86,rS()*360,px/sd.r0,secArt)}}
  /* 5. flores principales: espiral de Vogel (ángulo áureo), de afuera hacia el centro */
  const d=Rm*Math.sqrt(Math.PI/n),rad=d*.66;
  for(let i=n-1;i>=0;i--){const rr=Rm*Math.sqrt((i+.5)/n),th=i*GOLD+off,x=DC[0]+rr*Math.cos(th),y=DC[1]+rr*Math.sin(th)*.86;
    const s=rad*(.92+rM()*.16)/40,rot=S.main==='tulipan'?(x-DC[0])/Rm*22+(rM()-.5)*10:rM()*360;
    o+=at(x,y,rot,s,FL[S.main](T))}
  /* 6. papel frontal con pliegue y estampado */
  o+=`<path d="${FLP}" fill="${base}" stroke="${shade(base,.3)}" stroke-width="1.6" stroke-linejoin="round"/><path d="${FRP}" fill="${shade(base,.1)}" stroke="${shade(base,.3)}" stroke-width="1.6" stroke-linejoin="round"/>`;
  if(S.paperStyle!=='liso')o+=`<path d="${FLP}" fill="url(#pp)"/><path d="${FRP}" fill="url(#pp)"/>`;
  o+=`<path d="M0,0 Q-30,-90 -62,-187" fill="none" stroke="${tint(base,.55)}" stroke-width="2" opacity=".7"/><path d="M0,0 Q28,-90 58,-188" fill="none" stroke="${shade(base,.22)}" stroke-width="2" opacity=".5"/>`;
  o+=`<path d="M-98,-178 Q-50,-198 0,-170 Q50,-198 98,-178" fill="none" stroke="${tint(base,.6)}" stroke-width="3" stroke-linecap="round"/>`;
  /* 7. ramitas que se asoman por el borde del papel */
  const nf=S.size==='l'?5:4;
  for(let i=0;i<nf;i++){const x=-82+164*(i+.5)/nf+(rF()-.5)*12,px=sd.a+rF()*(sd.b-sd.a);
    if(sd.lin)o+=at(x,-176,x/85*38+(rF()-.5)*10,px/sd.r0,secArt);
    else o+=at(x,-180+(Math.abs(x)<30?8:0),rF()*360,px/sd.r0,secArt)}
  /* 8. listón y moño */
  o+=`<g clip-path="url(#clipF)"><path d="M-46,-79 Q0,-70 46,-79 L38,-61 Q0,-52 -38,-61Z" fill="${rib}" stroke="${shade(rib,.24)}" stroke-width="1.2"/></g>`;
  o+=`<g transform="translate(0 -68)">${bowSVG(S.bow,rib)}</g>`;
  return o;
}
const heart=(x,y,s,c,op)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0,6 C-14,-6 -10,-18 0,-10 C10,-18 14,-6 0,6Z" fill="${c}" opacity="${op}"/>`;
function scene(){
  const base=PAPERS.find(p=>p.id===S.paperColor).c,sz=SIZES[S.size];
  const label=`Ramo de ${MAINS.find(m=>m.id===S.main).n.toLowerCase()} con ${SECONDS.find(m=>m.id===S.second).n.toLowerCase()}, papel ${PAPERS.find(p=>p.id===S.paperColor).n.toLowerCase()} ${S.paperStyle}, listón ${RIBBONS.find(r=>r.id===S.ribbon).n.toLowerCase()}, entregado por ${ANIMALS[S.animal].art.toLowerCase().replace('el ','el ')}`;
  return `<svg viewBox="0 0 540 620" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">
  <defs>${patDef('pp',S.paperStyle,base)}<clipPath id="clipF"><path d="${FLP}"/><path d="${FRP}"/></clipPath></defs>
  ${heart(70,120,1.3,'#F9BFD0',.75)}${heart(470,96,.9,'#D9C8F2',.8)}${heart(500,250,.7,'#FFE58F',.9)}${heart(34,300,.8,'#BFEBDB',.9)}${heart(120,40,.6,'#FFE58F',.9)}${heart(430,20,.7,'#F9BFD0',.7)}
  <ellipse cx="270" cy="602" rx="240" ry="17" fill="#CDEBD7" opacity=".9"/>
  <g class="glide">
    <g transform="translate(372 598)"><ellipse cx="0" cy="0" rx="64" ry="9" fill="#5B3F63" opacity=".12"/><g class="hop">${bodySVG(S.animal)}</g></g>
    <g class="bqa"><g transform="translate(210 560) scale(${sz.S})">${bouquetInner()}</g></g>
    <g transform="translate(372 598)"><g class="hop">${armSVG(S.animal)}</g></g>
  </g></svg>`;
}

const icRibbon=c=>svgI('-56 -44 112 108',bowSVG('mono',c));
const icBow=v=>svgI('-56 -44 112 108',bowSVG(v,RIBBONS.find(r=>r.id===S.ribbon).c));
const icSize=k=>{const {N,R}=SIZES[k],rr={s:14,m:22,l:30}[k],dr={s:9,m:8,l:7.4}[k];let s='';

  return svgI('-40 -40 80 80',s)};
const icAnimal=k=>svgI('-68 -244 136 162',head(k));

/* ---------- estado y pasos ---------- */
const S={paperColor:'lila',paperStyle:'liso',main:'girasol',tone:'sol',second:'nube',ribbon:'rosa',bow:'mono',size:'m',animal:'perro',to:'',msg:'',seed:(Math.random()*1e6)|0};
const OPTS={
  paperColor:()=>PAPERS.map(p=>({v:p.id,l:p.n,i:icPaper(p.c)})),

const STEPS=[

  {id:'tam',pill:'Tamaño',title:'Elige el tamaño',hint:'Más flores, más ramo.',groups:[{key:'size'}]},

function panelHTML(){

  if(st.msg){
    h+=`<label class="field"><span>Para</span><input id="fTo" type="text" maxlength="24" placeholder="Tu nombre" value="${esc(S.to)}" autocomplete="off"></label>`
      +`<label class="field"><span>Mensaje</span><textarea id="fMsg" rows="3" maxlength="90" placeholder="Escribe algo bonito">${esc(S.msg)}</textarea></label>`

  }else{
    st.groups.forEach(g=>{
      h+=`<fieldset class="grp">${g.label?`<legend>${g.label}</legend>`:`<legend class="sr" style="position:absolute;left:-9999px">${st.title}</legend>`}<div class="opts">`
        +OPTS[g.key]().map(o=>`<button type="button" class="opt" data-key="${g.key}" data-val="${o.v}" aria-pressed="${S[g.key]===o.v}"><span class="ico">${o.i}</span><span>${o.l}</span></button>`).join('')
        +`</div></fieldset>`;

  }
  h+=`<div class="nav"><button type="button" class="btn" id="prev" ${step===0?'disabled':''}>Anterior</button>`
    +(step<STEPS.length-1?`<button type="button" class="btn primary" id="next">Siguiente</button>`:`<button type="button" class="btn primary" id="deliver2">Entregar mi ramo</button>`)+`</div>`;
  return h;
}
function drawPanel(focusSel){
  $('#panel').innerHTML=panelHTML();
  if(focusSel){const el=$('#panel').querySelector(focusSel);if(el)el.focus({preventScroll:true})}
}
function updateNote(){
  const n=$('#note');n.hidden=!delivered;if(!delivered)return;
  $('#noteTitle').textContent=`${ANIMALS[S.animal].art} te trae flores amarillas`;
  $('#noteTo').textContent=`Para ${S.to.trim()||'ti'},`;
  $('#noteMsg').textContent=S.msg.trim()||'con muchas flores amarillas.';
}
function petalRain(){
  const r=$('#rain');r.innerHTML='';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#FFD95E','#FFE58F','#F9BFD0','#D9C8F2','#FFF4C2'];
  for(let i=0;i<22;i++){const e=document.createElement('i'),s=9+Math.random()*10;
    e.style.cssText=`left:${(Math.random()*100).toFixed(1)}%;width:${s}px;height:${s*1.2}px;background:${cols[i%cols.length]};animation-delay:${(Math.random()*1.6+.6).toFixed(2)}s;animation-duration:${(2.6+Math.random()*1.6).toFixed(2)}s`;
    r.appendChild(e)}
  setTimeout(()=>{r.innerHTML=''},6000);
}
function deliver(){
  delivered=true;updateNote();
  const stage=$('#stage');stage.classList.remove('pop','deliver');void stage.offsetWidth;
  $('#art').innerHTML=scene();stage.classList.add('deliver');petalRain();
  setTimeout(()=>stage.classList.remove('deliver'),3400);
  $('#note').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function surprise(){
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  S.paperColor=pick(PAPERS).id;S.paperStyle=pick(STYLES)[0];S.main=pick(MAINS).id;S.tone=pick(Object.keys(TONES));
  S.second=pick(SECONDS).id;S.ribbon=pick(RIBBONS).id;S.bow=pick(BOWS)[0];S.size=pick(Object.keys(SIZES));S.animal=pick(Object.keys(ANIMALS));
  S.seed=(Math.random()*1e6)|0;
  drawStage('pop');drawPanel();updateNote();
}

/* ---------- eventos ---------- */
$('#panel').addEventListener('click',e=>{
  const opt=e.target.closest('.opt');
  if(opt){S[opt.dataset.key]=opt.dataset.val;drawStage('pop');drawPanel(`.opt[data-key="${opt.dataset.key}"][data-val="${opt.dataset.val}"]`);updateNote();return}
  const pill=e.target.closest('.pill');if(pill){step=+pill.dataset.step;drawPanel(`.pill[data-step="${step}"]`);return}
  if(e.target.closest('#prev')){step=Math.max(0,step-1);drawPanel('#next,#deliver2');return}
  if(e.target.closest('#next')){step=Math.min(STEPS.length-1,step+1);drawPanel('#next,#deliver2');return}
  if(e.target.closest('#deliver2')){deliver();return}
  const chip=e.target.closest('.chip');
  if(chip){S.msg=chip.dataset.msg;$('#fMsg').value=S.msg;updateNote()}
});
$('#panel').addEventListener('input',e=>{
  if(e.target.id==='fTo'){S.to=e.target.value;updateNote()}
  if(e.target.id==='fMsg'){S.msg=e.target.value;updateNote()}
});
$('#deliver').addEventListener('click',deliver);
$('#surprise').addEventListener('click',surprise);
$('#reroll').addEventListener('click',()=>{S.seed=(Math.random()*1e6)|0;drawStage('pop')});

drawStage();drawPanel();
</script>

<script>
  // Enlazamos nuestro panel de compartir a la función original de updateNote()
  const _originalUpdateNote = updateNote;
  updateNote = function() {
    _originalUpdateNote(); // Ejecuta la versión intacta que ya tenías
    const sharePanel = document.getElementById('share-actions');
    if(sharePanel) sharePanel.hidden = !delivered;
    
    // Mostramos un botón inteligente extra para celulares que soportan envío directo
    if (navigator.canShare && navigator.canShare({ files: [new File([''], 't.png', {type:'image/png'})] })) {
        document.getElementById('native-share-btn').style.display = 'inline-block';
    }
  };

  // Convertimos el SVG creado en una imagen perfecta y con fondo
  function getRamoCanvas(callback) {
    const svgElement = document.querySelector('#art svg');
    if (!svgElement) return;
    
    const svgData = new XMLSerializer().serializeToString(svgElement);
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = 540;
    canvas.height = 620;

    // Le ponemos el mismo fondo pastel del escenario a la imagen
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, '#FFF1C2');
    grad.addColorStop(0.58, '#FFE0E9');
    grad.addColorStop(1, '#E7DFFA');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const img = new Image();
    img.onload = function() {
      ctx.drawImage(img, 0, 0);
      callback(canvas);
    };
    img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svgData)));
  }

  // Descarga en formato PNG, JPG o WEBP
  function downloadRamo(format) {
    getRamoCanvas(function(canvas) {
      const mimeType = 'image/' + format;
      const dataUrl = canvas.toDataURL(mimeType, 1.0);
      const a = document.createElement("a");
      a.download = "mi_ramo_amarillo." + (format === 'jpeg' ? 'jpg' : format);
      a.href = dataUrl;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });
  }

  // Compartir por medio de enlaces directos (WhatsApp o Correo)
  function shareRamo(platform) {
    const destName = document.getElementById('noteTo').textContent || 'ti';
    const msgBody = document.getElementById('noteMsg').textContent || '';
    const msgText = encodeURIComponent(`¡Te preparé un ramo de flores amarillas! 🌻💛\n\nPara: ${destName}\nMensaje: ${msgBody}\n\n*Nota: Adjunta aquí la imagen de tu ramo descargado.*`);
    
    if (platform === 'wa') {
      window.open(`https://api.whatsapp.com/send?text=${msgText}`, '_blank');
    } else if (platform === 'em') {
      window.open(`mailto:?subject=Tu ramo de flores amarillas&body=${msgText}`, '_blank');
    }
    
    // Le avisamos al usuario por si no descargó su ramo
    alert("Tip: Recuerda que primero debes darle a 'Descargar' para poder adjuntar la fotito de tu ramo en tu " + (platform === 'wa' ? "mensaje." : "correo."));
  }

  // API Nativa para celulares (abre las opciones de envío del teléfono directo con la imagen real)
  function nativeShareRamo() {
    getRamoCanvas(function(canvas) {
      canvas.toBlob(async function(blob) {
        const file = new File([blob], "ramo_amarillo.png", { type: "image/png" });
        const destName = document.getElementById('noteTo').textContent || 'ti';
        const shareData = {
          files: [file],
          title: "Un ramo de flores amarillas",
          text: `¡Mira el ramo que te preparé! 🌻💛\nPara: ${destName}`
        };
        try {
          if (navigator.canShare && navigator.canShare({ files: shareData.files })) {
            await navigator.share(shareData);
          }
        } catch (err) {
          console.error("Error al compartir:", err);
        }
      }, "image/png");
    });
  }
</script>
